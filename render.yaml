services:
  - type: web
    name: cloud-learn-exp05
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/categories
    autoDeploy: false
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - key: DB_HOST
        fromDatabase:
          name: cloud-learn-exp05-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: cloud-learn-exp05-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: cloud-learn-exp05-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: cloud-learn-exp05-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: cloud-learn-exp05-db
          property: password

databases:
  - name: cloud-learn-exp05-db
    plan: free
